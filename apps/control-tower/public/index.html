<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AOP — Operations Control Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --white: #fffdf8;
        --off: #f7f4ed;
        --ink: #2f2a25;
        --muted: #756d64;
        --faint: rgba(74,61,50,.055);
        --line: rgba(74,61,50,.14);
        --line-strong: rgba(74,61,50,.25);
        --orange: #b45f3d;
        --orange-soft: rgba(180,95,61,.10);
        --blue: #56758f;
        --blue-soft: rgba(86,117,143,.10);
        --green: #4f8063;
        --green-soft: rgba(79,128,99,.11);
        --red: #b64b43;
        --red-soft: rgba(182,75,67,.10);
        --shadow: 0 1px 2px rgba(74,61,50,.035), 0 6px 20px rgba(74,61,50,.045);
        --radius: 10px;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; color: var(--ink); background: var(--off);
        background-image:
          radial-gradient(900px 500px at 12% -10%, rgba(180,95,61,.10), transparent 60%),
          radial-gradient(900px 500px at 100% 0%, rgba(213,181,139,.13), transparent 55%),
          linear-gradient(var(--faint) 1px, transparent 1px),
          linear-gradient(90deg, var(--faint) 1px, transparent 1px);
        background-size: auto, auto, 64px 64px, 64px 64px;
        background-position: 0 0, 0 0, -1px -1px, -1px -1px;
        display: grid; grid-template-rows: 64px 1fr; height: 100vh; overflow: hidden;
      }
      .mono { font-family: var(--mono); }
      .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .3px; color: var(--muted); }

      /* ── top bar ── */
      header {
        display: flex; align-items: center; gap: 14px; padding: 0 24px;
        background: rgba(255,253,248,.88); backdrop-filter: blur(14px) saturate(120%);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; flex-direction: column; line-height: 1.15; }
      .brand .k { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--orange); text-transform: uppercase; }
      .brand .n { font-size: 15px; font-weight: 750; color: var(--ink); letter-spacing: -.015em; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
        border: 1px solid var(--line-strong); border-radius: 999px; background: var(--white);
        font-size: 12px; color: var(--muted); white-space: nowrap;
      }
      .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
      .chip.ok .dot { background: var(--green); }
      .chip.off .dot { background: var(--line-strong); }
      .chip.live .dot { background: var(--blue); animation: pulse 1.8s infinite; }
      .chip b { color: var(--ink); font-weight: 600; }
      .chip.count { border-color: var(--orange); color: var(--orange); background: var(--orange-soft); font-weight: 700; }
      .spacer { flex: 1; }
      button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--white); color: var(--ink); padding: 8px 13px; transition: .14s; }
      button:hover { border-color: var(--muted); }
      button:disabled { opacity: .55; cursor: default; }
      .primary { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; box-shadow: 0 2px 10px rgba(180,95,61,.24); }
      .primary:hover { filter: brightness(1.05); border-color: var(--orange); }
      .ghost { background: transparent; }

      /* ── main grid ── */
      main { display: grid; grid-template-columns: 280px minmax(640px, 1fr) 340px; min-height: 0; }
      .rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; background: rgba(255,253,248,.42); }
      .workspace { overflow-y: auto; padding: 22px 24px; min-width: 0; }
      .inspector { border-left: 1px solid var(--line); overflow-y: auto; padding: 18px; background: rgba(255,253,248,.62); }
      @media (max-width: 1439px) {
        header { gap: 8px; padding-inline: 16px; }
        header .chip { padding-inline: 8px; }
        #slackChip { display: none; }
        main { grid-template-columns: 240px minmax(0, 1fr) 280px; }
        .workspace { padding-inline: 18px; }
        .inspector { padding: 15px; }
      }
      @media (max-width: 1119px) {
        header > .chip:nth-of-type(5) { display: none; }
        main { grid-template-columns: 260px minmax(0, 1fr); }
        .inspector { display: none; }
      }
      @media (max-width: 899px) {
        header > .chip { display: none; }
        main { grid-template-columns: 1fr; }
        .rail { display: none; }
      }

      /* ── rail ── */
      .rail h4, .insp h4 { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 14px 4px 8px; font-weight: 700; }
      .rail h4:first-child { margin-top: 2px; }
      .icard {
        border: 1px solid var(--line); background: var(--white); border-radius: 8px; padding: 11px 12px;
        margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); transition: .14s;
      }
      .icard:hover { border-color: var(--line-strong); }
      .icard.sel { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange), var(--shadow); }
      .icard.fresh { animation: railpulse 1.6s ease-out 2; }
      .icard .r1 { display: flex; align-items: center; gap: 7px; }
      .sev { font-family: var(--mono); font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 5px; }
      .sev.P1 { color: var(--red); background: var(--red-soft); }
      .sev.P2 { color: var(--orange); background: var(--orange-soft); }
      .sev.P3 { color: var(--blue); background: var(--blue-soft); }
      .icard .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .icard .subj { font-size: 13px; font-weight: 600; margin: 5px 0 4px; line-height: 1.3; }
      .icard .meta { display: flex; align-items: center; gap: 7px; }
      .stat { font-size: 10.5px; font-weight: 700; letter-spacing: .3px; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; }
      .st-RUNNING { color: var(--blue); background: var(--blue-soft); }
      .st-WAITING_APPROVAL { color: var(--orange); background: var(--orange-soft); }
      .st-RESOLVED { color: var(--green); background: var(--green-soft); }
      .st-BLOCKED,.st-REJECTED,.st-FAILED { color: var(--red); background: var(--red-soft); }
      .st-ESCALATED,.st-HALTED { color: var(--orange); background: var(--orange-soft); }

      /* ── workspace ── */
      .whead { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
      .whead .title { font-size: 20px; font-weight: 800; line-height: 1.2; }
      .whead .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
      .kv-row { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0 20px; padding: 12px 14px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
      .kv { display: flex; flex-direction: column; gap: 2px; }
      .kv .k { font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
      .kv .v { font-size: 13px; font-weight: 600; }
      .kv .v.mono { font-family: var(--mono); font-weight: 500; }

      /* lifecycle stepper */
      .life { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 14px; }
      .stage { flex: 0 0 auto; min-width: 92px; border: 1px solid var(--line); background: var(--white); border-radius: 7px; padding: 8px 10px; position: relative; }
      .stage.done { border-color: var(--green); }
      .stage.cur { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
      .stage.term { border-color: var(--red); }
      .stage .lbl { font-size: 12px; font-weight: 700; }
      .stage .code { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 1px; }
      .stage .dotrow { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
      .stage .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
      .stage.done .sd { background: var(--green); }
      .stage.cur .sd { background: var(--orange); animation: pulse 1.6s infinite; }
      .stage.term .sd { background: var(--red); }
      .stage .ev { font-size: 9px; color: var(--muted); }

      /* live activity + playback pacing */
      .activity { position: relative; overflow: hidden; }
      .activity::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--orange); }
      .activity-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
      .activity-copy { flex: 1 1 300px; min-width: 0; }
      .activity-title { font-size: 15px; font-weight: 750; margin: 3px 0 6px; color: var(--ink); }
      .activity-doing { font-size: 13px; line-height: 1.55; color: var(--muted); max-width: 68ch; }
      .activity-event { margin-top: 12px; padding: 10px 12px; background: var(--orange-soft); border: 1px solid rgba(180,95,61,.16); border-radius: 7px; font-family: var(--mono); font-size: 10.5px; line-height: 1.55; color: var(--orange); }
      .activity-progress { height: 3px; background: rgba(74,61,50,.07); margin-top: 14px; border-radius: 99px; overflow: hidden; }
      .activity-progress span { display: block; height: 100%; background: var(--orange); transition: width .25s ease; }
      .speed-panel { flex: 0 0 220px; padding: 10px 12px; border: 1px solid var(--line); background: var(--off); border-radius: 8px; }
      .speed-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
      .speed-label { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
      .speed-value { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--orange); }
      .speed-panel input[type="range"] { width: 100%; accent-color: var(--orange); cursor: pointer; }
      .speed-hint { margin-top: 5px; font-size: 10px; color: var(--muted); }
      .empty .speed-panel { width: min(300px, 100%); margin: 18px auto 0; text-align: left; }

      .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
      .card.focus { border-color: var(--orange); box-shadow: 0 0 0 1px rgba(180,95,61,.24), 0 8px 26px rgba(180,95,61,.07); }
      .card.blue { border-color: var(--blue); box-shadow: 0 0 0 1px rgba(86,117,143,.18), var(--shadow); }
      .card.green { border-color: var(--green); }
      .card.red { border-color: var(--red); }
      .card h3 { margin: 0 0 4px; font-size: 15px; }
      .card .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
      .eyebrow.orange { color: var(--orange); } .eyebrow.blue { color: var(--blue); } .eyebrow.green { color: var(--green); } .eyebrow.red { color: var(--red); }
      .facts { display: grid; grid-template-columns: 150px 1fr; gap: 7px 14px; margin-top: 10px; font-size: 13px; }
      .facts .fk { color: var(--muted); }
      .facts .fv { font-weight: 600; }
      .acts { display: flex; gap: 10px; margin-top: 16px; }
      .acts .primary, .acts .danger { flex: 1; text-align: center; }
      .danger { background: var(--white); border-color: var(--red); color: var(--red); font-weight: 700; }
      .danger:hover { background: var(--red-soft); border-color: var(--red); }
      .note { font-size: 12px; color: var(--muted); margin-top: 10px; }

      /* timeline */
      .tl { list-style: none; margin: 0; padding: 0; }
      .tl li { display: grid; grid-template-columns: 60px 20px 1fr; gap: 8px; padding: 5px 0; font-size: 12.5px; align-items: baseline; }
      .tl .ts { font-family: var(--mono); font-size: 10px; color: var(--muted); }
      .tl .ic { text-align: center; }
      .tl .tx { line-height: 1.45; }
      .tl .why .tx { color: var(--muted); font-style: italic; }
      .tl .blocked .tx { color: var(--red); font-weight: 600; }
      .tl .ok .tx { color: var(--ink); }
      .tl .evd { font-family: var(--mono); font-size: 9px; color: var(--blue); background: var(--blue-soft); padding: 0 5px; border-radius: 4px; margin-left: 6px; }

      /* inspector */
      .insp .env { border: 1px solid var(--line); border-radius: 14px; background: var(--white); box-shadow: var(--shadow); overflow: hidden; }
      .insp .env .top { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .insp .env .top .t { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--orange); text-transform: uppercase; }
      .insp .env .top .s { font-size: 12px; color: var(--muted); margin-top: 3px; }
      .erow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
      .erow:last-child { border-bottom: 0; }
      .erow .ek { color: var(--muted); }
      .erow .ev { font-family: var(--mono); font-size: 11.5px; font-weight: 500; text-align: right; }
      .badge-in { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 5px; }
      .b-green { color: var(--green); background: var(--green-soft); }
      .b-orange { color: var(--orange); background: var(--orange-soft); }
      .b-blue { color: var(--blue); background: var(--blue-soft); }
      .b-red { color: var(--red); background: var(--red-soft); }
      .b-gray { color: var(--muted); background: rgba(74,61,50,.055); }

      /* trust badge (narrow) */
      .trustbadge { display: none; }
      @media (max-width: 1439px) and (min-width: 1px) {
        .trustbadge { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--green); background: var(--green-soft); border-radius: 12px; margin-bottom: 16px; cursor: pointer; }
        .trustbadge .t { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--green); }
      }
      .overlay { position: fixed; inset: 0; background: rgba(47,42,37,.30); display: none; z-index: 40; }
      .overlay.show { display: block; }
      .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(420px, 92vw); background: var(--off); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(47,42,37,.18); transform: translateX(100%); transition: transform .22s; z-index: 41; overflow-y: auto; padding: 20px; }
      .drawer.show { transform: translateX(0); }
      .drawer h2 { font-size: 16px; margin: 0 0 4px; }
      .drawer .close { position: absolute; top: 14px; right: 16px; border: none; background: transparent; font-size: 20px; color: var(--muted); }
      .lab-group { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--orange); font-weight: 700; margin: 18px 2px 8px; }
      .lab { border: 1px solid var(--line); background: var(--white); border-radius: 12px; padding: 13px; margin-bottom: 10px; box-shadow: var(--shadow); }
      .lab .lt { font-size: 13.5px; font-weight: 700; }
      .lab .lc { font-size: 11.5px; color: var(--muted); margin: 4px 0; }
      .lab .le { font-size: 11.5px; color: var(--blue); }
      .lab button { margin-top: 10px; width: 100%; }

      /* application onboarding */
      .drawer.wide { width: min(760px, 96vw); }
      .wizard-steps { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; margin: 18px 0; }
      .wizard-step { padding: 8px 6px; border: 1px solid var(--line); border-radius: 7px; font: 10px var(--mono); color: var(--muted); text-align: center; }
      .wizard-step.active { color: var(--orange); border-color: var(--orange); background: var(--orange-soft); }
      .wizard-step.done { color: var(--green); border-color: rgba(79,128,99,.35); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
      .field.full { grid-column: 1/-1; }
      .field label { font-size: 10px; letter-spacing: .65px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
      .field input,.field select,.field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--white); color: var(--ink); padding: 9px 10px; font: 12.5px inherit; }
      .field textarea { min-height: 72px; resize: vertical; line-height: 1.45; }
      .field input:focus,.field select:focus,.field textarea:focus { outline: 2px solid rgba(180,95,61,.18); border-color: var(--orange); }
      .repeat-card { border: 1px solid var(--line); background: var(--white); border-radius: 10px; padding: 13px; margin-bottom: 10px; box-shadow: var(--shadow); }
      .repeat-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .repeat-head strong { font-size: 13px; }
      .repeat-head .spacer + button { padding: 4px 8px; font-size: 11px; }
      .wizard-actions { display: flex; justify-content: space-between; gap: 10px; position: sticky; bottom: -20px; padding: 14px 0 20px; background: linear-gradient(transparent,var(--off) 22%); }
      .wizard-error { padding: 10px 12px; margin: 10px 0; color: var(--red); background: var(--red-soft); border: 1px solid rgba(182,75,67,.25); border-radius: 7px; font-size: 12px; line-height: 1.5; }
      .review-row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
      .review-row span:first-child { color: var(--muted); }
      .registry { margin-top: 22px; text-align: left; }
      .registry-head { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
      .registry-head h3 { margin:0;font-size:13px; }
      .app-mini { display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:11px 12px;border:1px solid var(--line);background:var(--white);border-radius:8px;margin-bottom:7px;box-shadow:var(--shadow); }
      .app-mini .name { font-size:12.5px;font-weight:700; }
      .app-mini .meta { font:10px var(--mono);color:var(--muted);grid-column:1; }
      .app-mini .counts { font:10px var(--mono);color:var(--blue);grid-column:2;grid-row:1/3;align-self:center; }
      @media(max-width:600px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wizard-steps{grid-template-columns:1fr 1fr}}

      /* empty state */
      .empty { max-width: 560px; margin: 8vh auto 0; text-align: center; }
      .empty .rad { width: 70px; height: 70px; border-radius: 14px; margin: 0 auto 18px; background: radial-gradient(circle at 50% 40%, #d69a78, #b45f3d); box-shadow: 0 0 0 10px rgba(180,95,61,.06), 0 0 40px rgba(180,95,61,.18); animation: pulse 2.4s infinite; }
      .empty h2 { font-size: 20px; margin: 0 0 8px; }
      .empty p { color: var(--muted); font-size: 14px; line-height: 1.5; }
      .empty .hb { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 14px 0 20px; }
      .empty .acts { justify-content: center; }
      .empty .acts button { flex: 0 0 auto; }

      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes railpulse { 0% { box-shadow: 0 0 0 0 rgba(180,95,61,.35); } 100% { box-shadow: 0 0 0 8px rgba(180,95,61,0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      @media (max-width: 600px) { .speed-panel { flex-basis: 100%; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="k">Commerce Trust Labs · Agentic Operations</span><span class="n">Operations Control Tower</span></div>
      <span class="chip"><span class="dot"></span>DEMO</span>
      <span id="slackChip" class="chip off"><span class="dot"></span>Slack …</span>
      <span id="streamChip" class="chip off"><span class="dot"></span>Stream</span>
      <span id="domainChip" class="chip off"><span class="dot"></span>Profile + Wallet …</span>
      <span class="chip"><span class="dot" style="background:var(--green)"></span>Auto analysis: <b>ON</b></span>
      <span class="chip">Human approval: <b>R2+</b></span>
      <span class="spacer"></span>
      <span id="waitChip" class="chip count" style="display:none"></span>
      <button class="ghost" onclick="goHome()">Home</button>
      <button class="ghost" onclick="openRegistry()">Applications</button>
      <button class="ghost" onclick="openLab()">Demo Lab</button>
      <button class="ghost" onclick="openOnboarding()">Onboard App</button>
      <button class="primary" onclick="simulate()">Trigger Profile P1</button>
    </header>

    <main>
      <aside class="rail" id="rail"></aside>
      <section class="workspace" id="workspace"></section>
      <aside class="inspector insp" id="inspector"></aside>
    </main>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>
    <div class="drawer" id="drawer"></div>
    <div class="drawer" id="inspDrawer"></div>

    <script>
      const LANES = ["RECEIVED","OPC_MATCHED","CONTEXT","INVESTIGATING","DIAGNOSED","PLANNED","WAITING_APPROVAL","EXECUTING","VERIFYING","RESOLVED"];
      const LANE_LABEL = { RECEIVED:"Received", OPC_MATCHED:"Procedure matched", CONTEXT:"Context assembled", INVESTIGATING:"Investigating", DIAGNOSED:"Diagnosed", PLANNED:"Plan frozen", WAITING_APPROVAL:"Awaiting approval", EXECUTING:"Executing", VERIFYING:"Verifying", RESOLVED:"Resolved" };
      const LANE_CODE = { CONTEXT:"CONTEXT_ASSEMBLY" };
      const TERMINAL = ["RESOLVED","BLOCKED","REJECTED","FAILED","ESCALATED","HALTED"];
      const ICON = { step:"·", ok:"✓", blocked:"✕", why:"↳", approval:"◔", decision:"⚖" };
      const ACTIVITY = {
        RECEIVED: { title:"Receiving incident", doing:"Normalizing the incoming signal, assigning severity, and opening an evidence trail before analysis begins." },
        OPC_MATCHED: { title:"Matching an operating procedure", doing:"Comparing the incident against registered procedures and checking that the winning match clears the safety margin." },
        CONTEXT: { title:"Assembling trusted context", doing:"Fetching required service, deployment, and telemetry context while checking for missing or stale evidence." },
        INVESTIGATING: { title:"Investigating evidence", doing:"Correlating observations and hypotheses against the assembled context. No operational action is allowed yet." },
        DIAGNOSED: { title:"Grounding the diagnosis", doing:"Testing each diagnostic claim against evidence and recording unsupported or unresolved claims explicitly." },
        PLANNED: { title:"Freezing the remediation plan", doing:"Selecting a registered action, binding its parameters, and hashing the plan so later mutation forces re-approval." },
        WAITING_APPROVAL: { title:"Paused at the human gate", doing:"Policy classified this as an R2 production action. Execution is parked until an authorized, independent approver decides." },
        EXECUTING: { title:"Executing the authorized action", doing:"Rechecking target state, validating the frozen plan, and running only the approved action through the sandbox connector." },
        VERIFYING: { title:"Verifying the outcome", doing:"Running post-action checks and refusing to call the incident resolved until verification evidence passes." },
        RESOLVED: { title:"Recording the verified outcome", doing:"Reconstructing the run from ordered evidence and closing the incident with a durable audit trail." },
      };
      const SPEEDS = [
        { label:"0.5×", delay:2600 }, { label:"0.75×", delay:1800 }, { label:"1×", delay:1200 },
        { label:"2×", delay:600 }, { label:"4×", delay:200 },
      ];
      const LAB = {
        "cache-stampede": { group:"Cache + database", control:"Single-flight and TTL jitter", expect:"Contains synchronized cache misses" },
        "hot-key": { group:"Cache + database", control:"Hot-key replication and load shedding", expect:"Protects unrelated customer traffic" },
        "stale-kyc": { group:"Customer identity", control:"Versioned cache and fail-closed KYC", expect:"Blocks authorization on stale identity state" },
        "cache-penetration": { group:"Cache + database", control:"Negative cache and admission filter", expect:"Stops invalid IDs before the database" },
        "pool-exhaustion": { group:"Cache + database", control:"Bulkhead pool and backpressure", expect:"Preserves wallet-critical DB capacity" },
        "retry-storm": { group:"Cascading failures", control:"Backoff, jitter, and circuit breaker", expect:"Stops retry amplification" },
        "idempotency-expiry": { group:"Wallet integrity", control:"Ledger-bound idempotency", expect:"Refuses a duplicate debit" },
        "replica-lag": { group:"Wallet integrity", control:"Read-your-writes and revision preflight", expect:"Prevents action on stale balance" },
        "poisoned-cache": { group:"Release safety", control:"Versioned cache schema and canary", expect:"Quarantines incompatible entries" },
        "reconciliation-drift": { group:"Customer identity", control:"Authoritative ownership reconciliation", expect:"Freezes funds for human review" },
      };

      const incidents = new Map();
      let onboardedApps = [];
      let onboardStep = 0;
      let onboardDraft = null;
      let onboardError = "";
      let scenarios = [];
      let selectedId = null;
      const submitState = new Map();   // incidentId -> {phase, message}
      const seen = new Set();
      let speedIndex = Number(localStorage.getItem("aop-playback-speed") ?? 2);
      if (!Number.isInteger(speedIndex) || speedIndex < 0 || speedIndex >= SPEEDS.length) speedIndex = 2;

      const el = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
      const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString([], {hour12:false}); } catch { return ""; } };
      function elapsed(inc) {
        const end = TERMINAL.includes(inc.status) ? new Date(inc.updatedAt) : new Date();
        const s = Math.max(0, Math.floor((end - new Date(inc.createdAt)) / 1000));
        return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
      }

      async function post(url, body) {
        try { const r = await fetch(url, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body||{}) }); return await r.json().catch(()=>({})); }
        catch { return { error: "network" }; }
      }
      function playbackDelay() { return SPEEDS[speedIndex].delay; }
      function updateSpeed(value) {
        speedIndex = Math.max(0, Math.min(SPEEDS.length - 1, Number(value)));
        localStorage.setItem("aop-playback-speed", String(speedIndex));
        document.querySelectorAll(".speed-range").forEach(n => n.value = String(speedIndex));
        document.querySelectorAll(".speed-value").forEach(n => n.textContent = SPEEDS[speedIndex].label);
        post("/api/playback", { delayMs: playbackDelay() });
      }
      function speedControl() {
        return `<div class="speed-panel"><div class="speed-top"><span class="speed-label">Playback speed</span><span class="speed-value">${SPEEDS[speedIndex].label}</span></div>
          <input class="speed-range" type="range" min="0" max="4" step="1" value="${speedIndex}" oninput="updateSpeed(this.value)" aria-label="Playback speed" />
          <div class="speed-hint">Adjusts the next lifecycle transition live.</div></div>`;
      }
      function simulate() { post("/api/trigger", { key: "happy-path", source: "SIMULATOR", playbackDelayMs: playbackDelay() }); }
      function goHome() { selectedId = null; closeAll(); renderWorkspace(); renderInspector(); }

      // ── rail ordering ──
      function rank(inc) {
        if (inc.status === "WAITING_APPROVAL") return 0;
        if (inc.status === "RUNNING") return inc.severity === "P1" ? 1 : 2;
        if (["ESCALATED","HALTED","BLOCKED","REJECTED","FAILED"].includes(inc.status)) return 3;
        if (inc.status === "RESOLVED") return 4;
        return 5;
      }
      function renderRail() {
        const rail = el("rail");
        const list = [...incidents.values()].sort((a,b) => rank(a)-rank(b) || (a.createdAt < b.createdAt ? 1 : -1));
        if (!list.length) { rail.innerHTML = '<h4>Incidents</h4><div style="color:var(--muted);font-size:12px;padding:8px 4px">None yet.</div>'; return; }
        const groups = [["Waiting for approval",[0]],["Active",[1,2]],["Escalated / blocked",[3]],["Recently resolved",[4,5]]];
        let html = "";
        for (const [label, ranks] of groups) {
          const g = list.filter(i => ranks.includes(rank(i)));
          if (!g.length) continue;
          html += `<h4>${label}</h4>`;
          for (const inc of g) html += railCard(inc);
        }
        rail.innerHTML = html;
      }
      function railCard(inc) {
        const fresh = !seen.has(inc.id) ? " fresh" : "";
        return `<div class="icard${inc.id===selectedId?" sel":""}${fresh}" onclick="select('${inc.id}')">
          <div class="r1"><span class="sev ${inc.severity||"P2"}">${inc.severity||"P2"}</span><span class="id">${inc.id}</span></div>
          <div class="subj">${esc(inc.subject)}</div>
          <div class="meta"><span class="stat st-${inc.status}">${inc.status.replace(/_/g," ")}</span><span class="tag">${esc(inc.service||"")}</span></div>
        </div>`;
      }
      function select(id) { selectedId = id; renderAll(); }

      // ── workspace ──
      function renderWorkspace() {
        const ws = el("workspace");
        const inc = incidents.get(selectedId);
        if (!inc) { ws.innerHTML = emptyState(); return; }
        ws.innerHTML = trustBadge(inc) + header(inc) + lifecycle(inc) + activityPane(inc) + decisionCard(inc) + timeline(inc);
      }
      function emptyState() {
        return `<div class="empty">
          <div class="rad"></div>
          <h2>Listening for production incidents</h2>
          <p>AOP is monitoring your operations channel. New incidents are matched to an operating procedure and investigated automatically — production actions pause for human approval.</p>
          <div class="hb" id="hbLine">Last heartbeat: —</div>${speedControl()}
          <div class="acts"><button class="primary" onclick="simulate()">Trigger Profile P1</button><button class="ghost" onclick="openOnboarding()">Onboard an App</button><button class="ghost" onclick="openLab()">Open Demo Lab</button></div>
          ${registryPreview()}
        </div>`;
      }
      function registryPreview() {
        const cards = onboardedApps.slice(0,3).map(app=>`<div class="app-mini"><div class="name">${esc(app.name)}</div><div class="meta">${esc(app.environment)} · ${esc(app.owner)}</div><div class="counts">${app.services.length} svc · ${app.triggers.length} triggers · ${app.sops.length} SOP</div></div>`).join("");
        return `<div class="registry"><div class="registry-head"><h3>Agentic OPS applications</h3><span class="spacer"></span><button class="ghost" onclick="openRegistry()">View registry</button></div>${cards||'<div class="note">No applications onboarded yet.</div>'}</div>`;
      }
      function header(inc) {
        return `<div class="whead"><div>
            <div class="title">${esc(inc.subject)}</div>
            <div class="sub"><span class="mono">${inc.id}</span> · ${LANE_LABEL[inc.lane]||inc.lane}</div>
          </div><div class="spacer"></div>
          <span class="sev ${inc.severity||"P2"}" style="font-size:12px;padding:3px 9px">${inc.severity||"P2"}</span>
          <span class="stat st-${inc.status}" style="font-size:12px">${inc.status.replace(/_/g," ")}</span>
        </div>
        <div class="kv-row">
          <div class="kv"><span class="k">Service</span><span class="v mono">${esc(inc.service||"—")}</span></div>
          <div class="kv"><span class="k">Source</span><span class="v mono">${inc.source||"—"}</span></div>
          <div class="kv"><span class="k">Mode</span><span class="v">${esc(inc.mode||"—")}</span></div>
          <div class="kv"><span class="k">Human gate</span><span class="v">${esc(inc.humanGate||"—")}</span></div>
          <div class="kv"><span class="k">Elapsed</span><span class="v mono">${elapsed(inc)}</span></div>
        </div>`;
      }
      function lifecycle(inc) {
        const idx = TERMINAL.includes(inc.status) && inc.status!=="RESOLVED" ? LANES.indexOf(inc.lane) : LANES.indexOf(inc.lane);
        const term = TERMINAL.includes(inc.status) && inc.status!=="RESOLVED";
        let html = '<div class="life">';
        LANES.forEach((lane, i) => {
          let cls = "stage";
          if (inc.status==="RESOLVED") cls += " done";
          else if (i < idx) cls += " done";
          else if (i === idx) cls += term ? " term" : " cur";
          const evd = inc.timeline.filter(t => t.evidenceType).length;
          html += `<div class="${cls}"><div class="lbl">${LANE_LABEL[lane]}</div><div class="code">${LANE_CODE[lane]||lane}</div><div class="dotrow"><span class="sd"></span></div></div>`;
        });
        html += "</div>";
        return html;
      }

      function activityPane(inc) {
        const info = ACTIVITY[inc.lane] || { title: LANE_LABEL[inc.lane] || inc.lane, doing:"Processing the current governed lifecycle step." };
        const latest = inc.timeline?.length ? inc.timeline[inc.timeline.length - 1] : null;
        const idx = Math.max(0, LANES.indexOf(inc.lane));
        const progress = Math.round(((idx + 1) / LANES.length) * 100);
        return `<div class="card activity"><div class="activity-head"><div class="activity-copy">
          <div class="eyebrow orange">Live agent activity · ${idx + 1}/${LANES.length}</div>
          <div class="activity-title">${esc(info.title)}</div><div class="activity-doing">${esc(info.doing)}</div>
          ${latest ? `<div class="activity-event"><span style="opacity:.65">LATEST EVIDENCE</span><br>${esc(latest.text)}</div>` : ""}
          </div>${speedControl()}</div><div class="activity-progress"><span style="width:${progress}%"></span></div></div>`;
      }

      function decisionCard(inc) {
        const ss = submitState.get(inc.id);
        const a = inc.approval;
        // Approval — pending
        if (inc.status === "WAITING_APPROVAL" && a && !a.decision) {
          const phase = ss?.phase;
          let actions;
          if (phase === "ALREADY" || phase === "UNKNOWN") {
            actions = `<div class="note" style="color:${phase==="UNKNOWN"?"var(--red)":"var(--muted)"}">${esc(ss.message)}</div>`;
          } else if (phase) {
            actions = `<div class="acts"><button class="primary" disabled>${phase==="SUBMITTING"?"Submitting decision…":"Waiting for authorization record…"}</button></div>`;
          } else {
            actions = `<div class="acts"><button class="danger" onclick="decide('${inc.id}','REJECTED')">Reject</button><button class="primary" onclick="decide('${inc.id}','APPROVED')">Approve action</button></div>`;
          }
          const profileFix = a.action === "remediate_profile_db_cache";
          return `<div class="card focus"><div class="eyebrow orange">Human authorization required</div>
            <h3>${profileFix?"Restore profile database + cache":"Restart "+esc(inc.service||"service")}</h3>
            <div class="facts">
              ${profileFix?`<span class="fk">DB target</span><span class="fv mono">${esc(a.parameters?.dbLatencyMs)} ms</span>
              <span class="fk">Cache policy</span><span class="fv mono">TTL ${esc(a.parameters?.cacheTtlSeconds)}s · pre-warm · single-flight</span>`:`<span class="fk">Target version</span><span class="fv mono">${esc(a.parameters?.version??"—")}</span>`}
              <span class="fk">Risk class</span><span class="fv">R2 · Production</span>
              <span class="fk">Proposed by</span><span class="fv">Sam — On-Call Engineer <span class="tag">(${esc(a.proposer)})</span></span>
              <span class="fk">Required role</span><span class="fv mono">${esc(a.requiredRole)}</span>
              <span class="fk">Reason</span><span class="fv" style="font-weight:500">${esc(a.reason)}</span>
            </div>${actions}
            <div class="note">First valid decision — from Slack or the Control Tower — wins. The proposer cannot approve their own action.</div>
          </div>`;
        }
        // Approval — resolved
        if (a && a.decision) {
          const approved = a.decision === "APPROVED";
          const via = a.decidedVia === "slack" ? "in Slack" : "in the Control Tower";
          const fixes = inc.timeline.filter(t=>t.kind==="ok" && t.text.startsWith("Fixed:"));
          const comparison = [...inc.timeline].reverse().find(t=>t.text.startsWith("Before → after:"));
          return `<div class="card ${approved?"green":"red"}"><div class="eyebrow ${approved?"green":"red"}">${approved?"Authorization issued":"Action rejected"}</div>
            <h3>${approved?"Approved":"Rejected"} by ${esc(a.decidedBy)} ${via}</h3>
            ${fixes.length?`<div class="facts">${fixes.map(f=>`<span class="fk">Fixed</span><span class="fv">${esc(f.text.slice(7))}</span>`).join("")}${comparison?`<span class="fk">Verified impact</span><span class="fv">${esc(comparison.text.slice(16))}</span>`:""}</div>`:""}
            <p class="note">${approved?`Authorization issued on behalf of ${esc(a.decidedBy)} — Senior On-Call Lead. ${inc.status==="RESOLVED"?"The profile-to-wallet recovery was verified with live probes.":"The approved remediation is executing now."}`:"A human declined the action; nothing was executed. The rejection is on the audit trail."}</p>
          </div>`;
        }
        // Terminal guardrail
        if (["BLOCKED","ESCALATED","HALTED","REJECTED","FAILED"].includes(inc.status)) {
          const blk = [...inc.timeline].reverse().find(t=>t.kind==="blocked");
          const why = [...inc.timeline].reverse().find(t=>t.kind==="why");
          return `<div class="card red"><div class="eyebrow red">Control enforced — ${inc.status.toLowerCase()}</div>
            <h3>${esc(blk?.text||inc.status)}</h3>${why?`<p class="note">${esc(why.text)}</p>`:""}</div>`;
        }
        // Resolved
        if (inc.status === "RESOLVED") {
          return `<div class="card green"><div class="eyebrow green">Resolved · verified</div>
            <h3>Remediation verified and recorded</h3>
            <p class="note">The action executed against the sandbox, verification passed, and the full run was reconstructed from the evidence ledger.</p></div>`;
        }
        // Investigating
        if (inc.analysis) {
          const an = inc.analysis;
          return `<div class="card blue"><div class="eyebrow blue">Diagnosing incident</div>
            <h3>${esc(an.likelyCause)}</h3>
            <div class="facts">
              <span class="fk">Evidence</span><span class="fv">${an.grounded}/${an.claims} claims · all grounded</span>
              <span class="fk">Missing context</span><span class="fv">${an.missingContext}</span>
              <span class="fk">Stale context</span><span class="fv">${an.staleContext}</span>
            </div>
            <div class="note">Confidence is reported as itemized, evidence-grounded dimensions — never a single fabricated percentage.</div>
          </div>`;
        }
        return `<div class="card blue"><div class="eyebrow blue">Working</div><h3>${LANE_LABEL[inc.lane]||inc.lane}…</h3></div>`;
      }

      function timeline(inc) {
        const rows = inc.timeline.map(t =>
          `<li class="${t.kind}"><span class="ts">${fmtTime(t.at)}</span><span class="ic">${ICON[t.kind]||"·"}</span><span class="tx">${esc(t.text)}${t.evidenceType?`<span class="evd">${t.evidenceType}</span>`:""}</span></li>`
        ).join("");
        return `<div class="card"><div class="eyebrow" style="color:var(--muted)">Evidence-backed event timeline</div><ul class="tl">${rows||'<li><span></span><span></span><span class="tx" style="color:var(--muted)">No events yet.</span></li>'}</ul></div>`;
      }

      // ── approval state machine ──
      async function decide(id, decision) {
        submitState.set(id, { phase: "SUBMITTING" });
        renderAll();
        const res = await post(`/api/incidents/${id}/decision`, { decision, actorId: "riley-lead" });
        if (res && res.settled === false) {
          const via = res.decidedVia === "slack" ? "via Slack" : "via the Control Tower";
          submitState.set(id, { phase: "ALREADY", message: `Decision already recorded by ${res.decidedBy||"another operator"} ${via}.` });
          renderAll();
          return;
        }
        submitState.set(id, { phase: "AWAITING_LEDGER" });
        renderAll();
        // Wait for the ledger-confirmed event (incident.approval.decision via SSE).
        setTimeout(() => {
          const inc = incidents.get(id);
          if (submitState.get(id)?.phase === "AWAITING_LEDGER" && !(inc?.approval?.decision)) {
            submitState.set(id, { phase: "UNKNOWN", message: "Status unknown — reconciling with the ledger. Re-open the incident to retry." });
            renderAll();
          }
        }, 8000);
      }

      // ── trust inspector ──
      function b(val, kind) { return `<span class="badge-in b-${kind}">${esc(val)}</span>`; }
      function inspectorHtml(inc) {
        if (!inc) return '<h4>Trust envelope</h4><div style="color:var(--muted);font-size:12px;padding:6px 4px">Select an incident to inspect its trust envelope.</div>';
        const t = inc.trust || {};
        const policyBadge = t.policy ? b(t.policy, t.policy==="REQUIRE_APPROVAL"?"orange":"blue") : "—";
        const connBadge = t.connector ? b(t.connector, t.connector==="SANDBOX"?"gray":"green") : "—";
        const authBadge = t.authorization ? b(t.authorization, "blue") : "—";
        const planBadge = t.planIntegrity ? b("SHA-256 verified", "green") : "—";
        const rows = [
          ["Procedure", t.procedure ? `<span class="mono">${esc(t.procedure)} · ${esc(t.procedureVersion||"")}</span>` : "—"],
          ["Context", t.contextFresh ? `${t.contextFresh} fresh` : "—"],
          ["Claims", t.claims ? `${t.claims} grounded` : "—"],
          ["Plan integrity", planBadge],
          ["Plan hash", t.planHash ? `<span class="mono" style="font-size:10px">${esc(t.planHash)}</span>` : "—"],
          ["Policy", policyBadge],
          ["Authorization", authBadge],
          ["Connector", connBadge],
          ["Ledger", t.ledger!=null ? `${t.ledger} events` : "—"],
        ];
        return `<h4>Trust envelope</h4>
          <div class="env"><div class="top"><div class="t">Trust envelope</div><div class="s">Incident ${esc(inc.id)}</div></div>
          ${rows.map(([k,v])=>`<div class="erow"><span class="ek">${k}</span><span class="ev">${v}</span></div>`).join("")}
          </div>${listenerCard()}`;
      }
      let listener = { enabled:false, inboundReady:false, channel:null, mode:"Simulator", approvalCallbacks:"Public callback URL required", verification:"unverified", lastEventAt:null, heartbeatAt:null };
      let domain = { ok:false };
      function ago(iso) { if(!iso) return "—"; const s=Math.floor((Date.now()-new Date(iso))/1000); return s<60?`${s}s ago`:`${Math.floor(s/60)}m ago`; }
      function listenerCard() {
        return `<h4 style="margin-top:18px">Listener</h4>
          <div class="env">
            <div class="top"><div class="t" style="color:${listener.inboundReady?"var(--green)":"var(--orange)"}">Slack ${listener.inboundReady?"interactive approvals active":listener.enabled?"outbound delivery active":"offline"}</div></div>
            <div class="erow"><span class="ek">Channel</span><span class="ev mono">${esc(listener.channel||"—")}</span></div>
            <div class="erow"><span class="ek">Mode</span><span class="ev">${esc(listener.mode)}</span></div>
            <div class="erow"><span class="ek">Approval callbacks</span><span class="ev">${esc(listener.approvalCallbacks||"—")}</span></div>
            <div class="erow"><span class="ek">Last event</span><span class="ev">${ago(listener.lastEventAt)}</span></div>
            <div class="erow"><span class="ek">Heartbeat</span><span class="ev">${ago(listener.heartbeatAt)}</span></div>
            <div class="erow"><span class="ek">Verification</span><span class="ev">${listener.verification==="Signature valid"?b("Signature valid","green"):b(listener.verification,"gray")}</span></div>
          </div>`;
      }
      function renderInspector() { el("inspector").innerHTML = inspectorHtml(incidents.get(selectedId)); }
      function trustBadge(inc) {
        const t = inc.trust||{}; const ok = t.claims && t.planIntegrity;
        return `<div class="trustbadge" onclick="openInspector()"><span class="t">Trust ${ok?"verified":"envelope"}</span><span style="font-size:12px;color:var(--muted)">${t.claims?`${t.claims} grounded`:"—"} · ${t.policy||"policy"} · ${t.connector||"—"} ›</span></div>`;
      }
      function openInspector() { const d=el("inspDrawer"); d.innerHTML = `<button class="close" onclick="closeAll()">✕</button><div class="insp">${inspectorHtml(incidents.get(selectedId))}</div>`; el("overlay").classList.add("show"); d.classList.add("show"); }

      // ── application onboarding registry ──
      const splitList = (value) => String(value||"").split(/[,\n]/).map(v=>v.trim()).filter(Boolean);
      const selected = (value, expected) => value===expected ? " selected" : "";
      function freshOnboarding() {
        return { name:"", owner:"", environment:"PRODUCTION", description:"", status:"ACTIVE",
          services:[{id:"service-api",name:"Service API",baseUrl:"http://127.0.0.1:4200",healthPath:"/healthz",access:{mode:"READ_ONLY",allowedActions:["read_status"],credentialRef:"env:SERVICE_API_TOKEN",approvalRequired:true}}],
          triggers:[{id:"trigger-latency",type:"METRIC",event:"service.p95",condition:"> 500ms for 3 minutes",severity:"P1",enabled:true}],
          sops:[{id:"sop-latency",name:"Service Latency Response",version:"1.0.0",matchTerms:["latency","timeout"],serviceIds:["service-api"],steps:["Inspect service health and dependency metrics","Identify the constrained dependency","Freeze the remediation plan","Request approval when required","Execute through the registered connector","Verify customer-facing recovery"],riskClass:"R2",approvalRole:"senior_oncall",enabled:true}] };
      }
      function openOnboarding(id) {
        const existing = id ? onboardedApps.find(a=>a.id===id) : null;
        onboardDraft = existing ? JSON.parse(JSON.stringify(existing)) : freshOnboarding();
        onboardStep = 0; onboardError = "";
        const d=el("drawer"); d.classList.add("wide"); el("overlay").classList.add("show"); d.classList.add("show"); renderOnboarding();
      }
      function wizardHead() {
        return `<button class="close" onclick="closeAll()">✕</button><h2>${onboardDraft.id?"Edit":"Onboard"} Agentic OPS application</h2><p class="note">Define what can trigger the agent, which SOP it may run, and the exact service access it receives.</p><div class="wizard-steps">${["Application","Services + access","Triggers","SOPs","Review"].map((name,i)=>`<div class="wizard-step ${i===onboardStep?"active":i<onboardStep?"done":""}">${i+1}. ${name}</div>`).join("")}</div>`;
      }
      function renderOnboarding() {
        const d=el("drawer"); let body="";
        if(onboardStep===0) body=`<div class="form-grid">
          <div class="field"><label>Application name</label><input value="${esc(onboardDraft.name)}" oninput="onboardDraft.name=this.value" placeholder="Payments Platform"></div>
          <div class="field"><label>Owner / team</label><input value="${esc(onboardDraft.owner)}" oninput="onboardDraft.owner=this.value" placeholder="Commerce Platform"></div>
          <div class="field"><label>Environment</label><select onchange="onboardDraft.environment=this.value"><option${selected(onboardDraft.environment,"DEVELOPMENT")}>DEVELOPMENT</option><option${selected(onboardDraft.environment,"STAGING")}>STAGING</option><option${selected(onboardDraft.environment,"PRODUCTION")}>PRODUCTION</option></select></div>
          <div class="field"><label>Status</label><select onchange="onboardDraft.status=this.value"><option${selected(onboardDraft.status,"ACTIVE")}>ACTIVE</option><option${selected(onboardDraft.status,"DRAFT")}>DRAFT</option></select></div>
          <div class="field full"><label>Operational scope</label><textarea oninput="onboardDraft.description=this.value" placeholder="What customer or business capability does this application own?">${esc(onboardDraft.description)}</textarea></div></div>`;
        if(onboardStep===1) body=`<p class="note">Grant least-privilege actions per service. Credential fields accept references only—never paste a token.</p>${onboardDraft.services.map(serviceForm).join("")}<button class="ghost" onclick="addService()">+ Add service</button>`;
        if(onboardStep===2) body=`<p class="note">Triggers describe how incidents enter Agentic OPS. Conditions remain explicit and auditable.</p>${onboardDraft.triggers.map(triggerForm).join("")}<button class="ghost" onclick="addTrigger()">+ Add trigger</button>`;
        if(onboardStep===3) body=`<p class="note">SOPs bind matching signals to services, ordered steps, risk, and approval policy.</p>${onboardDraft.sops.map(sopForm).join("")}<button class="ghost" onclick="addSop()">+ Add SOP</button>`;
        if(onboardStep===4) body=onboardingReview();
        d.innerHTML=wizardHead()+(onboardError?`<div class="wizard-error">${esc(onboardError)}</div>`:"")+body+`<div class="wizard-actions"><button class="ghost" onclick="onboardBack()" ${onboardStep===0?"disabled":""}>Back</button>${onboardStep<4?'<button class="primary" onclick="onboardNext()">Continue</button>':'<button class="primary" onclick="saveOnboarding()">Activate configuration</button>'}</div>`;
      }
      function serviceForm(s,i) { return `<div class="repeat-card"><div class="repeat-head"><strong>Service ${i+1}</strong><span class="tag">least privilege</span><span class="spacer"></span>${onboardDraft.services.length>1?`<button onclick="removeService(${i})">Remove</button>`:""}</div><div class="form-grid">
        <div class="field"><label>Service id</label><input value="${esc(s.id)}" oninput="onboardDraft.services[${i}].id=this.value"></div><div class="field"><label>Display name</label><input value="${esc(s.name)}" oninput="onboardDraft.services[${i}].name=this.value"></div>
        <div class="field full"><label>Base URL</label><input value="${esc(s.baseUrl)}" oninput="onboardDraft.services[${i}].baseUrl=this.value"></div><div class="field"><label>Health path</label><input value="${esc(s.healthPath)}" oninput="onboardDraft.services[${i}].healthPath=this.value"></div>
        <div class="field"><label>Access mode</label><select onchange="onboardDraft.services[${i}].access.mode=this.value"><option${selected(s.access.mode,"READ_ONLY")}>READ_ONLY</option><option${selected(s.access.mode,"CONTROLLED_WRITE")}>CONTROLLED_WRITE</option><option${selected(s.access.mode,"FULL")}>FULL</option></select></div>
        <div class="field full"><label>Allowed actions (comma separated)</label><input value="${esc(s.access.allowedActions.join(", "))}" oninput="onboardDraft.services[${i}].access.allowedActions=splitList(this.value)"></div>
        <div class="field"><label>Credential reference</label><input value="${esc(s.access.credentialRef||"")}" oninput="onboardDraft.services[${i}].access.credentialRef=this.value" placeholder="vault:team/service"></div><div class="field"><label>Approval policy</label><select onchange="onboardDraft.services[${i}].access.approvalRequired=this.value==='true'"><option value="true"${s.access.approvalRequired?" selected":""}>Required for writes</option><option value="false"${!s.access.approvalRequired?" selected":""}>Policy decides</option></select></div></div></div>`; }
      function triggerForm(t,i) { return `<div class="repeat-card"><div class="repeat-head"><strong>Trigger ${i+1}</strong><span class="stat st-RUNNING">${esc(t.severity)}</span><span class="spacer"></span>${onboardDraft.triggers.length>1?`<button onclick="removeTrigger(${i})">Remove</button>`:""}</div><div class="form-grid">
        <div class="field"><label>Type</label><select onchange="onboardDraft.triggers[${i}].type=this.value"><option${selected(t.type,"METRIC")}>METRIC</option><option${selected(t.type,"WEBHOOK")}>WEBHOOK</option><option${selected(t.type,"SLACK")}>SLACK</option><option${selected(t.type,"EVENT_BUS")}>EVENT_BUS</option><option${selected(t.type,"SCHEDULE")}>SCHEDULE</option></select></div>
        <div class="field"><label>Severity</label><select onchange="onboardDraft.triggers[${i}].severity=this.value"><option${selected(t.severity,"P1")}>P1</option><option${selected(t.severity,"P2")}>P2</option><option${selected(t.severity,"P3")}>P3</option></select></div>
        <div class="field"><label>Event / signal</label><input value="${esc(t.event)}" oninput="onboardDraft.triggers[${i}].event=this.value"></div><div class="field"><label>Condition</label><input value="${esc(t.condition)}" oninput="onboardDraft.triggers[${i}].condition=this.value"></div></div></div>`; }
      function sopForm(s,i) { return `<div class="repeat-card"><div class="repeat-head"><strong>SOP ${i+1}</strong><span class="tag">${esc(s.riskClass)}</span><span class="spacer"></span>${onboardDraft.sops.length>1?`<button onclick="removeSop(${i})">Remove</button>`:""}</div><div class="form-grid">
        <div class="field"><label>Name</label><input value="${esc(s.name)}" oninput="onboardDraft.sops[${i}].name=this.value"></div><div class="field"><label>Version</label><input value="${esc(s.version)}" oninput="onboardDraft.sops[${i}].version=this.value"></div>
        <div class="field full"><label>Match terms</label><input value="${esc(s.matchTerms.join(", "))}" oninput="onboardDraft.sops[${i}].matchTerms=splitList(this.value)"></div><div class="field full"><label>Service ids</label><input value="${esc(s.serviceIds.join(", "))}" oninput="onboardDraft.sops[${i}].serviceIds=splitList(this.value)"></div>
        <div class="field"><label>Risk class</label><select onchange="onboardDraft.sops[${i}].riskClass=this.value"><option${selected(s.riskClass,"R0")}>R0</option><option${selected(s.riskClass,"R1")}>R1</option><option${selected(s.riskClass,"R2")}>R2</option><option${selected(s.riskClass,"R3")}>R3</option></select></div><div class="field"><label>Approval role</label><input value="${esc(s.approvalRole||"")}" oninput="onboardDraft.sops[${i}].approvalRole=this.value" placeholder="senior_oncall"></div>
        <div class="field full"><label>Ordered steps (one per line)</label><textarea oninput="onboardDraft.sops[${i}].steps=splitList(this.value)">${esc(s.steps.join("\n"))}</textarea></div></div></div>`; }
      function onboardingReview() { return `<div class="card"><div class="eyebrow orange">Configuration ready for validation</div><div class="review-row"><span>Application</span><strong>${esc(onboardDraft.name||"—")}</strong></div><div class="review-row"><span>Owner / environment</span><strong>${esc(onboardDraft.owner||"—")} · ${esc(onboardDraft.environment)}</strong></div><div class="review-row"><span>Services + access</span><strong>${onboardDraft.services.map(s=>`${esc(s.name||s.id)} (${esc(s.access.mode)}: ${s.access.allowedActions.length} actions)`).join("<br>")}</strong></div><div class="review-row"><span>Triggers</span><strong>${onboardDraft.triggers.map(t=>`${esc(t.type)} · ${esc(t.event)} · ${esc(t.severity)}`).join("<br>")}</strong></div><div class="review-row"><span>SOPs</span><strong>${onboardDraft.sops.map(s=>`${esc(s.name)} v${esc(s.version)} · ${esc(s.riskClass)} · ${s.steps.length} steps`).join("<br>")}</strong></div><div class="note">Activation validates service references, credential references, SOP completeness, and approval roles before saving.</div></div>`; }
      function addService(){onboardDraft.services.push({id:`service-${onboardDraft.services.length+1}`,name:"",baseUrl:"http://127.0.0.1:4200",healthPath:"/healthz",access:{mode:"READ_ONLY",allowedActions:["read_status"],credentialRef:"env:SERVICE_API_TOKEN",approvalRequired:true}});renderOnboarding()}
      function addTrigger(){onboardDraft.triggers.push({id:`trigger-${onboardDraft.triggers.length+1}`,type:"WEBHOOK",event:"incident.created",condition:"severity is P1",severity:"P1",enabled:true});renderOnboarding()}
      function addSop(){onboardDraft.sops.push({id:`sop-${onboardDraft.sops.length+1}`,name:"",version:"1.0.0",matchTerms:[],serviceIds:onboardDraft.services.slice(0,1).map(s=>s.id),steps:[],riskClass:"R2",approvalRole:"senior_oncall",enabled:true});renderOnboarding()}
      function removeService(i){onboardDraft.services.splice(i,1);renderOnboarding()} function removeTrigger(i){onboardDraft.triggers.splice(i,1);renderOnboarding()} function removeSop(i){onboardDraft.sops.splice(i,1);renderOnboarding()}
      function onboardNext(){onboardError="";if(onboardStep===0&&(!onboardDraft.name.trim()||!onboardDraft.owner.trim()))onboardError="Application name and owner are required.";if(onboardStep===1&&!onboardDraft.services.length)onboardError="Add at least one service.";if(onboardStep===2&&!onboardDraft.triggers.length)onboardError="Add at least one trigger.";if(onboardStep===3&&!onboardDraft.sops.length)onboardError="Add at least one SOP.";if(!onboardError)onboardStep=Math.min(4,onboardStep+1);renderOnboarding()}
      function onboardBack(){onboardError="";onboardStep=Math.max(0,onboardStep-1);renderOnboarding()}
      async function saveOnboarding(){onboardError="";const method=onboardDraft.id?"PUT":"POST";const url=onboardDraft.id?`/api/onboarding/apps/${onboardDraft.id}`:"/api/onboarding/apps";try{const r=await fetch(url,{method,headers:{"content-type":"application/json"},body:JSON.stringify(onboardDraft)});const result=await r.json();if(!r.ok){onboardError=(result.issues||[result.error]).join(" · ");renderOnboarding();return}await loadOnboardedApps();openRegistry(result.app.id)}catch(e){onboardError="Could not save configuration: "+e.message;renderOnboarding()}}
      async function loadOnboardedApps(){try{const result=await(await fetch("/api/onboarding/apps")).json();onboardedApps=result.apps||[]}catch{onboardedApps=[]}if(!incidents.get(selectedId))renderWorkspace()}
      function openRegistry(focusId){const d=el("drawer");d.classList.add("wide");let html=`<button class="close" onclick="closeAll()">✕</button><h2>Agentic OPS application registry</h2><p class="note">${onboardedApps.length} application(s) · ${onboardedApps.reduce((n,a)=>n+a.services.length,0)} services · ${onboardedApps.reduce((n,a)=>n+a.triggers.length,0)} triggers · ${onboardedApps.reduce((n,a)=>n+a.sops.length,0)} SOPs</p><div class="acts"><button class="primary" onclick="openOnboarding()">Onboard application</button></div>`;for(const app of onboardedApps){html+=`<div class="repeat-card" style="${focusId===app.id?'border-color:var(--green)':''}"><div class="repeat-head"><strong>${esc(app.name)}</strong><span class="stat st-${app.status==='ACTIVE'?'RESOLVED':'ESCALATED'}">${esc(app.status)}</span><span class="spacer"></span><button onclick="openOnboarding('${app.id}')">Edit</button></div><div class="note">${esc(app.description)}</div><div class="facts"><span class="fk">Owner</span><span class="fv">${esc(app.owner)}</span><span class="fk">Environment</span><span class="fv mono">${esc(app.environment)}</span><span class="fk">Services</span><span class="fv">${app.services.map(s=>`${esc(s.name)} · ${esc(s.access.mode)} · ${s.access.allowedActions.length} actions`).join("<br>")}</span><span class="fk">Triggers</span><span class="fv">${app.triggers.map(t=>`${esc(t.type)} · ${esc(t.event)} · ${esc(t.severity)}`).join("<br>")}</span><span class="fk">SOPs</span><span class="fv">${app.sops.map(s=>`${esc(s.name)} · ${esc(s.riskClass)} · ${esc(s.approvalRole||"automatic")}`).join("<br>")}</span></div></div>`}d.innerHTML=html;el("overlay").classList.add("show");d.classList.add("show")}

      // ── demo lab ──
      function openLab() {
        const groups = {};
        scenarios.filter(s=>s.scene>=2).forEach(s=>{ const m=LAB[s.key]||{}; (groups[m.group||"Scenarios"]=groups[m.group||"Scenarios"]||[]).push(s); });
        let html = `<button class="close" onclick="closeAll()">✕</button><h2>Demo Lab · Top 10 revenue-risk incidents</h2><p style="color:var(--muted);font-size:13px;margin:0 0 6px">Realistic cache, database, identity, and wallet failure patterns. Each run exposes impact evidence, the safety control, and expected containment.</p>`;
        for (const [g, list] of Object.entries(groups)) {
          html += `<div class="lab-group">${g}</div>`;
          for (const s of list) { const m=LAB[s.key]||{}; html += `<div class="lab"><div class="lt">${esc(s.title.split("—")[0].trim())}</div><div class="lc">Control: ${esc(m.control||"")}</div><div class="le">Expected: ${esc(m.expect||"")}</div><button class="ghost" onclick="runLab('${s.key}')">Run scenario</button></div>`; }
        }
        el("drawer").innerHTML = html; el("overlay").classList.add("show"); el("drawer").classList.add("show");
      }
      function runLab(key) { post("/api/trigger", { key, source: "DEMO", playbackDelayMs: playbackDelay() }); closeAll(); }
      function closeAll() { el("overlay").classList.remove("show"); el("drawer").classList.remove("show","wide"); el("inspDrawer").classList.remove("show"); }

      // ── top bar ──
      function renderTopBar() {
        const waiting = [...incidents.values()].filter(i=>i.status==="WAITING_APPROVAL").length;
        const wc = el("waitChip");
        if (waiting) { wc.style.display=""; wc.textContent = `${waiting} awaiting approval`; } else wc.style.display="none";
        const sc = el("slackChip");
        sc.className = "chip " + (listener.inboundReady?"ok":listener.enabled?"live":"off");
        sc.innerHTML = `<span class="dot"></span>Slack ${listener.inboundReady?(listener.channel?"#"+esc(listener.channel):"interactive"):listener.enabled?"outbound only":"UI-only"}`;
        const dc = el("domainChip");
        dc.className = "chip " + (domain.ok?"ok":"off");
        dc.innerHTML = `<span class="dot"></span>Profile + Wallet ${domain.ok?"live":"offline"}`;
      }

      function renderAll() { renderTopBar(); renderRail(); renderWorkspace(); renderInspector(); [...incidents.keys()].forEach(id=>seen.add(id)); }

      // ── streams ──
      function connect() {
        const s = el("streamChip");
        const es = new EventSource("/api/stream");
        es.addEventListener("snapshot", (e) => {
          const m = JSON.parse(e.data); scenarios = m.scenarios;
          incidents.clear(); m.incidents.forEach(i=>incidents.set(i.id,i));
          if (!selectedId && m.incidents.length) selectedId = m.incidents[0].id;
          s.className="chip live"; s.innerHTML='<span class="dot"></span>Stream · <b>Live</b>';
          renderAll();
        });
        es.addEventListener("incident", (e) => {
          const inc = JSON.parse(e.data).incident;
          const isNew = !incidents.has(inc.id);
          incidents.set(inc.id, inc);
          if (inc.approval?.decision) submitState.delete(inc.id);
          if (isNew && (!selectedId || !incidents.get(selectedId))) selectedId = inc.id;
          renderAll();
        });
        es.onerror = () => { s.className="chip off"; s.innerHTML='<span class="dot"></span>Stream · reconnecting'; };
      }
      async function pollListener() {
        try { listener = await (await fetch("/api/listener")).json(); } catch {}
        try { domain = await (await fetch("/api/customer-domain")).json(); } catch { domain = {ok:false}; }
        renderTopBar(); renderInspector();
        const hb = el("hbLine"); if (hb) hb.textContent = "Last heartbeat: " + ago(listener.heartbeatAt);
      }

      connect();
      loadOnboardedApps();
      post("/api/playback", { delayMs: playbackDelay() });
      pollListener(); setInterval(pollListener, 15000);
      setInterval(() => { if (incidents.get(selectedId) && !TERMINAL.includes(incidents.get(selectedId).status)) renderWorkspace(); }, 1000);
    </script>
  </body>
</html>
